<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Démo du bouton Signaler</title>
  <style>
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
    .carte { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin: 16px 0; }
    button.panne { padding: 10px 14px; border-radius: 10px; border: 1px solid #cbd5e1; background: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Une application de démonstration</h1>
    <div class="carte">
      <p>Client : <b>Marie Exemple</b> · Devis n° D-0042</p>
      <button class="panne" id="panne">Enregistrer (ce bouton plante)</button>
    </div>
    <p>Touchez la coccinelle 🐞 en bas à droite : elle photographie cet écran, vous laisse écrire ou dicter, et envoie le tout au relais.</p>
  </main>
  <script>
    document.getElementById('panne').addEventListener('click', function () { console.error('TypeError: devis.client is undefined'); });
    // Démo : adresse du relais passée dans l'URL (?relais=http://localhost:8787), sinon le relais local de développement.
    window.SignalerConfig = { endpoint: new URLSearchParams(location.search).get('relais') || 'http://localhost:8787', version: 'demo-1.0', utilisateur: function () { return 'marie@exemple.fr'; } };
  </script>
  <script src="../widget/signaler.js" defer></script>
</body>
</html>
